version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: rsvp-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./rsvp.db
      - DEBUG=false
    volumes:
      - ./backend:/app
      - rsvp_db:/app
    networks:
      - rsvp-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: rsvp-frontend
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/app
    networks:
      - rsvp-network

volumes:
  rsvp_db:

networks:
  rsvp-network:
    driver: bridge
